  mysql:
    image: mysql:8.4
    container_name: shortlink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports: ["13001:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    mem_limit: 1g
    networks: [link-hub-network]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shortlink-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports: ["25672:5672", "15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    mem_limit: 512m
    networks: [link-hub-network]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: shortlink-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: [ "9200:9200" ]
    volumes: [ es-data:/usr/share/elasticsearch/data ]
    mem_limit: 1g
    networks: [ link-hub-network ]
  # ---------- 监控告警：Prometheus ----------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: shortlink-prometheus
    restart: always
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [link-hub-network]

  # ---------- 数据大盘：Grafana ----------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: shortlink-grafana
    restart: always
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [link-hub-network]

volumes:
  mysql-data:
  rabbitmq-data:
  redis-data:
  redis-data-1:
  redis-data-2:
  redis-data-3:
  redis-data-4:
  redis-data-5:
  redis-data-6:
  es-data:
  prometheus-data: # 🌟 新增
  grafana-data:
networks:
  link-hub-network:
    driver: bridge