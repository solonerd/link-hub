# 日常: docker compose up -d redis mysql rabbitmq
# 集群演示: 再 up 六个 redis-node-*，然后手动 cluster create（用 HOST_IP）
name: short-link-cluster

x-redis: &redis
  image: redis:7.4-alpine
  restart: always
  networks: [link-hub-network]

services:
  # ---------- 日常单机 ----------
  redis:
    <<: *redis
    container_name: shortlink-redis
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

