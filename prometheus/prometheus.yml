global:
  scrape_interval: 15s      # 每 15 秒抓取一次数据
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'link-hub'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s     # 本地测试设为 5 秒，刷新更快
    static_configs:
      # host.docker.internal 允许容器内的 Prometheus 访问宿主机上运行的 Spring Boot (18080 端口)
      - targets: ['host.docker.internal:18080']
        labels:
          application: 'link-hub'