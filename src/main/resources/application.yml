server:
  port: 18080

# IP: default remoteAddr only; set trust-forwarded-headers=true only behind a trusted proxy
client-ip:
  trust-forwarded-headers: false

# Agent 对话记忆：Redis TTL（天）
agent:
  chat-memory:
    ttl-days: 7

spring:
  # 读取项目根目录 .env；没有文件也不报错
  config:
    import: optional:file:.env[.properties]
  devtools:
    restart:
      enabled: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: link-hub
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.linkhub.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: del_flag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

knife4j:
  enable: true
  setting:
    enable-swagger-models: true
    enable-document-manage: true

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-time: 1800000
  refresh-expiration-time: 604800000
  filter-order: 1

# 1. 在 security.whitelist 列表中增加一行放行配置
security:
  whitelist:
    - /auth/**
    - /redirect/**
    - /doc.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    - /error
    - /favicon.ico
    - /actuator/health
    - /actuator/prometheus   # 🌟 必须放行，防止 Prometheus 抓取时报 401

# 2. 在 application.yml 底部添加 management 节点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name:link-hub}      # 可选：健康检查

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${AI_API_KEY}
      model-name: deepseek-chat
      temperature: 0.3
      timeout: 30s
      max-retries: 2                 # 新增：provider 偶发 5xx 自动重试
      log-requests: true
      log-responses: true

    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${AI_API_KEY}
      model-name: deepseek-chat
      temperature: 0.3
    embedding-model:
      base-url: https://api.siliconflow.cn/v1
      api-key: ${EMBEDDING_API_KEY}      # 在 .env 里加一行 EMBEDDING_API_KEY=sk-xxx
      model-name: BAAI/bge-m3
      log-requests: true
      log-responses: true

elasticsearch:
  server-url: ${ES_SERVER_URL:http://localhost:9200}
  index-name: linkhub_faq_index

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-SYSTEM}] %-5level %logger{36} - %msg%n"